[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "model-graph-viz"
version = "1.0.0"
description = "Visualize neural network computational graphs with configurable transformation passes"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["openvino>=2024.0", "graphviz>=0.20", "numpy>=1.24"]

[project.optional-dependencies]
test = ["pytest>=8.0"]

[project.scripts]
model-graph-viewer = "mgv.cli:main"

[tool.setuptools.packages.find]
include = ["mgv*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = [
    # graphviz starts the `dot` subprocess while OpenVINO's threads exist; harmless here.
    "ignore:This process .* is multi-threaded:DeprecationWarning",
]

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]

[tool.mypy]
python_version = "3.10"
ignore_missing_imports = true   # openvino and graphviz ship no type stubs
